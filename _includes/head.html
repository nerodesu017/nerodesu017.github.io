<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/default.min.css">
  <script src="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/languages/javascript.min.js"></script>
  <script>hljs.initHighlightingOnLoad();</script>
  <link rel="stylesheet" href="{{ "/assets/github-theme.css" | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Roboto+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --body-bg: #E2E8E4;
      --body-color: #000;
      --a-hover: #111;
      --a-visited: #1756a9;
    }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      :root {
        --body-bg: #000;
        --body-color: #E2E8E4;
        --a-hover: #69a0f1;
        --a-visited: #a02eaa;
      }
    }

    body {
      background-color: var(--body-bg);
      color: var(--body-color);
    }

    a:hover {
      color: var(--a-hover);
    }

    a:visited {
      color: var(--a-visited);
    }

    body {
      font-family: 'Inter', sans-serif;
      font-size: 18px;
      line-height: 1.6;
      margin: 0;
      padding: 20px;
    }

    .code {
      font-family: 'Roboto Mono', monospace;
    }

    @media only screen and (max-width: 768px) {
      body {
        font-size: 16px;
        line-height: 1.5;
        padding: 10px;
      }
    }

    @media only screen and (max-width: 480px) {
      body {
        font-size: 14px;
        line-height: 1.4;
        padding: 5px;
      }
    }

  </style>
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
  {%- include google-analytics.html -%}
  {%- endif -%}
</head>
